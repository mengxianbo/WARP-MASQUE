name: Build WARP-MASQUE OpenWrt package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'openwrt/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '20 3 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false

      - name: Build upstream usque for OpenWrt x86_64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.5.0 https://github.com/Diniboy1123/usque.git upstream
          cd upstream
          go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/usque" .

      - name: Assemble OpenWrt IPK
        run: |
          set -euxo pipefail
          STAGE="$RUNNER_TEMP/ipk-root"
          mkdir -p "$STAGE/usr/bin" "$STAGE/etc/config" "$STAGE/etc/init.d"
          install -m 0755 usque "$STAGE/usr/bin/usque"
          install -m 0644 openwrt/files/warp-masque.config "$STAGE/etc/config/warp-masque"
          install -m 0755 openwrt/files/warp-masque.init "$STAGE/etc/init.d/warp-masque"

          mkdir -p dist "$RUNNER_TEMP/ipk-control"
          cat > "$RUNNER_TEMP/ipk-control/control" <<'EOF'
          Package: warp-masque
          Version: 1.0.0-1
          Architecture: x86_64
          Maintainer: mengxianbo
          Section: net
          Priority: optional
          Depends: ca-bundle
          Description: Cloudflare WARP MASQUE SOCKS5 and HTTP CONNECT proxy for OpenWrt. No TUN and no route takeover.
          EOF

          cd "$RUNNER_TEMP/ipk-control"
          tar --numeric-owner --owner=0 --group=0 -czf "$RUNNER_TEMP/control.tar.gz" control
          cd "$STAGE"
          tar --numeric-owner --owner=0 --group=0 -czf "$RUNNER_TEMP/data.tar.gz" .
          cd "$RUNNER_TEMP"
          printf '2.0\n' > debian-binary
          ar -cr "$GITHUB_WORKSPACE/dist/warp-masque_1.0.0-1_x86_64.ipk" debian-binary control.tar.gz data.tar.gz
          file "$GITHUB_WORKSPACE/dist/warp-masque_1.0.0-1_x86_64.ipk"
          ar t "$GITHUB_WORKSPACE/dist/warp-masque_1.0.0-1_x86_64.ipk"

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-masque-openwrt-x86_64
          path: dist/*.ipk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WARP-MASQUE build ${{ github.run_number }}
          files: dist/*.ipk
          generate_release_notes: true
