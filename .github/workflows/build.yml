# Rebuild trigger: 2026-11-24
name: Build WARP-MASQUE OpenWrt package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'openwrt/**'
      - 'luci/**'
      - 'README.md'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '20 3 * * 1'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Build upstream usque for OpenWrt x86_64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.5.0 https://github.com/Diniboy1123/usque.git upstream
          cd upstream
          go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/usque" .
      - name: Assemble OpenWrt IPK
        run: |
          set -euxo pipefail
          STAGE="$RUNNER_TEMP/ipk-root"
          mkdir -p "$STAGE/usr/bin" "$STAGE/etc/config" "$STAGE/etc/init.d"
          mkdir -p "$STAGE/usr/libexec" "$STAGE/usr/lib/lua/luci/controller" "$STAGE/usr/lib/lua/luci/model/cbi"
          mkdir -p "$STAGE/usr/share/licenses/warp-masque"
          install -m 0644 LICENSE "$STAGE/usr/share/licenses/warp-masque/LICENSE"
          install -m 0644 THIRD_PARTY_NOTICES.md "$STAGE/usr/share/licenses/warp-masque/THIRD_PARTY_NOTICES.md"
          install -m 0755 usque "$STAGE/usr/bin/usque"
          install -m 0644 openwrt/files/warp-masque.config "$STAGE/etc/config/warp-masque"
          install -m 0755 openwrt/files/warp-masque.init "$STAGE/etc/init.d/warp-masque"
          install -m 0755 openwrt/files/warp-masquectl "$STAGE/usr/libexec/warp-masque"
          install -m 0644 luci/controller/warp-masque.lua "$STAGE/usr/lib/lua/luci/controller/warp-masque.lua"
          install -m 0644 luci/model/cbi/warp-masque.lua "$STAGE/usr/lib/lua/luci/model/cbi/warp-masque.lua"
          mkdir -p dist "$RUNNER_TEMP/ipk-control"
          cat > "$RUNNER_TEMP/ipk-control/control" <<'EOF'
          Package: warp-masque
          Version: 1.2.0-1
          Architecture: x86_64
          Maintainer: mengxianbo
          License: GPL-3.0-only AND MIT
          Section: net
          Priority: optional
          Depends: ca-bundle, luci-base
          Description: Cloudflare WARP MASQUE SOCKS5 and HTTP CONNECT proxy for OpenWrt with Chinese LuCI management.
          EOF
          cd "$RUNNER_TEMP/ipk-control"
          tar --numeric-owner --owner=0 --group=0 -czf "$RUNNER_TEMP/control.tar.gz" control
          cd "$STAGE"
          tar --numeric-owner --owner=0 --group=0 -czf "$RUNNER_TEMP/data.tar.gz" .
          cd "$RUNNER_TEMP"
          printf '2.0\n' > debian-binary
          # OpenWrt opkg IPK format is a gzip-compressed tar archive,
          # NOT the Debian .deb ar archive.
          tar --format=gnu --numeric-owner --owner=0 --group=0 \
            -czf "$GITHUB_WORKSPACE/dist/warp-masque_1.2.0-1_x86_64.ipk" \
            ./debian-binary ./data.tar.gz ./control.tar.gz
          gzip -t "$GITHUB_WORKSPACE/dist/warp-masque_1.2.0-1_x86_64.ipk"
          tar -tzf "$GITHUB_WORKSPACE/dist/warp-masque_1.2.0-1_x86_64.ipk"
          test "$(tar -xOzf "$GITHUB_WORKSPACE/dist/warp-masque_1.2.0-1_x86_64.ipk" ./debian-binary)" = "2.0"
      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-masque-openwrt-x86_64
          path: dist/*.ipk
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WARP-MASQUE build ${{ github.run_number }}
          files: dist/*.ipk
          generate_release_notes: true
